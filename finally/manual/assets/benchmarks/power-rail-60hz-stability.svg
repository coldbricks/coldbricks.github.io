<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">60 Hz stability — normalized conditioned-rail characteristic</title>
  <desc id="desc">Normalized presentation card showing eight clean 60 Hz cycles on a Furman-conditioned reference rail. The observed output-flux envelope stayed within plus or minus one percent of nominal. The sine is a normalized characteristic, not a direct voltage, current, or wattage trace.</desc>
  <style>
    svg { shape-rendering: geometricPrecision; text-rendering: geometricPrecision; }
    text { fill: #EFE6F0; font-family: system-ui, sans-serif; font-weight: 500; }
    .title { fill: #FFF6FB; font-size: 34px; font-weight: 700; letter-spacing: 0.2px; }
    .subtitle, .caption { fill: #C9B8CC; font-size: 19px; }
    .tick, .legend { fill: #E0D2E2; font-size: 20px; }
    .axis-label, .panel-label { fill: #B6FFFB; font-size: 22px; font-weight: 700; }
    .grid { stroke: #7F627F; stroke-width: 1.6; opacity: 0.52; }
    .axis { stroke: #D9CADC; stroke-width: 2.4; opacity: 0.96; }
    .envelope { stroke: #E8C468; stroke-width: 3; stroke-dasharray: 10 7; opacity: 0.98; }
    .series { fill: none; stroke: #2EE6C5; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <text class="title" x="70" y="48">60 Hz stability · normalized rail characteristic</text>
  <text class="subtitle" x="70" y="78">Furman-conditioned reference rail · nominal 60 Hz · 8 cycles · observed output-flux envelope ≤ ±1%</text>

