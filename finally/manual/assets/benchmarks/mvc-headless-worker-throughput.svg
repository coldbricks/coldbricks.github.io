<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Chloe MVC Engine headless worker throughput on Quest 3</title>
  <desc id="desc">On the exact official MVC title, auto mode decoded 32.0884 stereo pairs per second, six workers decoded 32.2047, and four workers decoded 32.1034. The 24 pairs per second reference line is the decoder gate. Lines connect the recorded test order only.</desc>
  <style>
    svg { color: CanvasText; }
    text { fill: currentColor; font-family: system-ui, sans-serif; font-weight: 400; }
    .title { font-size: 28px; font-weight: 500; }
    .subtitle, .caption, .tick { font-size: 16px; }
    .axis-label { font-size: 18px; font-weight: 500; }
    .grid { stroke: currentColor; stroke-width: 1; opacity: 0.16; }
    .axis { stroke: currentColor; stroke-width: 1.5; opacity: 0.72; }
    .target { stroke: currentColor; stroke-width: 2; stroke-dasharray: 9 7; opacity: 0.58; }
    .series { fill: none; stroke: currentColor; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .point { fill: Canvas; stroke: currentColor; stroke-width: 4; }
  </style>

  <text class="title" x="70" y="48">Headless MVC decoder throughput</text>
  <text class="subtitle" x="70" y="78">Quest 3 · Chloe MVC Engine 1 / edge264 (BSD) · run 1785277886881</text>

  <line class="grid" x1="150" y1="412.8" x2="1080" y2="412.8"/>
  <line class="grid" x1="150" y1="343.9" x2="1080" y2="343.9"/>
  <line class="grid" x1="150" y1="275.0" x2="1080" y2="275.0"/>
  <line class="grid" x1="150" y1="206.1" x2="1080" y2="206.1"/>
  <line class="grid" x1="150" y1="137.2" x2="1080" y2="137.2"/>
  <line class="axis" x1="150" y1="120" x2="150" y2="430"/>
  <line class="axis" x1="150" y1="430" x2="1080" y2="430"/>
  <line class="target" x1="150" y1="412.8" x2="1080" y2="412.8"/>

  <text class="tick" x="132" y="419" text-anchor="end">24</text>
  <text class="tick" x="132" y="350" text-anchor="end">26</text>
  <text class="tick" x="132" y="281" text-anchor="end">28</text>
  <text class="tick" x="132" y="212" text-anchor="end">30</text>
  <text class="tick" x="132" y="143" text-anchor="end">32</text>
  <text class="axis-label" x="58" y="275" text-anchor="middle" transform="rotate(-90 58 275)">stereo pairs / second</text>
  <text class="tick" x="1070" y="403" text-anchor="end">24.0 gate</text>

  <path class="series" d="M250 134.2 L600 130.2 L950 133.7"/>
  <circle class="point" cx="250" cy="134.2" r="8"/>
  <circle class="point" cx="600" cy="130.2" r="8"/>
  <circle class="point" cx="950" cy="133.7" r="8"/>

  <text class="axis-label" x="250" y="111" text-anchor="middle">32.0884</text>
  <text class="axis-label" x="600" y="107" text-anchor="middle">32.2047</text>
  <text class="axis-label" x="950" y="111" text-anchor="middle">32.1034</text>
  <text class="tick" x="250" y="462" text-anchor="middle">Auto</text>
  <text class="tick" x="600" y="462" text-anchor="middle">6 workers</text>
  <text class="tick" x="950" y="462" text-anchor="middle">4 workers</text>
  <text class="tick" x="950" y="488" text-anchor="middle">product policy</text>

  <text class="caption" x="70" y="525">Four workers were 0.315% below six while reserving two reported processors for OpenXR and audio.</text>
</svg>
